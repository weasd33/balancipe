spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/balancipe
    username: balancipe
    password: balancipe
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: localhost
      port: 6379

logging:
  level:
    com.beokay.balancipe: DEBUG
    org.hibernate.SQL: DEBUG
