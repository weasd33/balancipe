services:
  postgres:
    image: postgres:16
    container_name: balancipe-postgres
    environment:
      POSTGRES_DB: balancipe
      POSTGRES_USER: balancipe
      POSTGRES_PASSWORD: balancipe
      TZ: Asia/Seoul
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: balancipe-redis
    environment:
      TZ: Asia/Seoul
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
