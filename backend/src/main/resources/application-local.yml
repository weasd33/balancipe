spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/balancipe
    username: balancipe
    password: balancipe
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: localhost
      port: 6379
  flyway:
    baseline-version: 0 # 로컬은 재시작마다 빈 DB이므로 V1(users 테이블 생성)부터 실제 적용

jwt:
  secret: local-dev-secret-key-change-me-32-bytes-minimum!!

logging:
  level:
    com.beokay.balancipe: DEBUG
    org.hibernate.SQL: DEBUG
